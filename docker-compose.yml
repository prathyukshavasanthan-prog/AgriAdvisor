services:
  mongo:
    image: mongo:7.0
    container_name: agriadvisor-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agriadvisor
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: agriadvisor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: agriadvisor-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriadvisor-backend
    restart: unless-stopped
    ports:
      - "5900:5900"
    environment:
      PORT: 5900
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/agriadvisor
      JWT_SECRET: supersecretagriadvisorkey2026_change_in_production
      FRONTEND_URL: http://localhost:5273
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - mongo
      - redis
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5900
    container_name: agriadvisor-frontend
    restart: unless-stopped
    ports:
      - "5273:5273"
    environment:
      PORT: 5273
    depends_on:
      - backend

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
