services:
  # ============================================================================
  # 1. ML Microservice (FastAPI + PyTorch on CPU)
  # ============================================================================
  - type: web
    name: agriadvisor-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ============================================================================
  # 2. Backend API Service (Node.js + Express + MongoDB)
  # ============================================================================
  - type: web
    name: agriadvisor-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ============================================================================
  # 3. Frontend Web App (React + Vite SPA on Render Global CDN)
  # ============================================================================
  - type: web
    name: agriadvisor-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
